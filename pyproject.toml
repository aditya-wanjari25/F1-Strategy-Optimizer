[project]
name = "f1-strategy-optimizer"
version = "0.1.0"
description = "A multi-agent F1 race strategy optimizer using LangGraph and FastF1"
requires-python = ">=3.11"

dependencies = [
    "fastf1>=3.4.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "langfuse>=4.5.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "graph", "observability"]
